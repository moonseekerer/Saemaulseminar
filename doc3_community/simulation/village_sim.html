<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농촌 지역사회 행위자 시뮬레이터 (Saemaul-Smallville 자율 모드)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #12161f;
            color: #d1d5db;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            line-height: 1.5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 12px;
            border-bottom: 1px solid #2d3748;
            margin-bottom: 16px;
        }
        .title-block h1 {
            font-size: 18px;
            font-weight: 600;
            color: #f3f4f6;
            letter-spacing: -0.02em;
        }
        .title-block p {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 3px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #1a202c;
            border: 1px solid #2d3748;
            padding: 8px 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #2d3748;
            color: #e5e7eb;
            border: 1px solid #4a5568;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn:hover { background-color: #4a5568; }
        .btn-active {
            background-color: #2b6cb0;
            border-color: #3182ce;
            color: #ffffff;
        }

        .select-agent {
            background-color: #2d3748;
            color: #e5e7eb;
            border: 1px solid #4a5568;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .timeline-ctrl {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            font-size: 12px;
            color: #a0aec0;
        }
        .timeline-ctrl input[type="range"] {
            width: 180px;
            accent-color: #4299e1;
            cursor: pointer;
        }
        .time-display {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: #63b3ed;
            min-width: 44px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1080px 1fr;
            gap: 16px;
            align-items: start;
        }

        .canvas-frame {
            border: 1px solid #2d3748;
            background-color: #0d1117;
            width: 1080px;
            height: 780px;
            position: relative;
            cursor: grab;
        }
        .canvas-frame:active { cursor: grabbing; }
        #villageCanvas { display: block; }

        .analysis-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 780px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            padding-bottom: 6px;
            border-bottom: 1px solid #2d3748;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .data-table-container {
            height: 330px;
            overflow-y: auto;
            border: 1px solid #2d3748;
            background-color: #1a202c;
        }
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        table.data-table th {
            background-color: #242c3d;
            color: #cbd5e0;
            padding: 7px 10px;
            border-bottom: 1px solid #2d3748;
            position: sticky;
            top: 0;
            font-weight: 600;
        }
        table.data-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #232a3b;
            color: #e2e8f0;
        }
        table.data-table tr:hover { background-color: #202738; }

        .log-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #2d3748;
            background-color: #1a202c;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }
        .log-entry {
            border-bottom: 1px solid #242c3d;
            padding-bottom: 6px;
        }
        .log-meta {
            color: #718096;
            font-size: 11px;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }
        .log-actors {
            color: #63b3ed;
            font-weight: 500;
        }
        .log-text {
            color: #edf2f7;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-block">
            <h1>농촌 행위자 상호작용 시뮬레이터 (Saemaul-Smallville)</h1>
            <p>12인 행위자의 자율 동기 및 호혜성(Reciprocity)에 의한 창발적 상호작용 실증 모델</p>
        </div>
        <div>
            <button class="btn" onclick="sim.exportHistoryJSON()">기록 내보내기 (JSON)</button>
        </div>
    </header>

    <div class="controls">
        <button class="btn btn-active" id="btnPlayPause" onclick="togglePlay()">일시정지</button>
        <button class="btn" id="btnSpd1" onclick="setSpeed(1.0)">1배속</button>
        <button class="btn" id="btnSpd2" onclick="setSpeed(2.0)">2배속</button>
        <button class="btn" id="btnSpd5" onclick="setSpeed(5.0)">5배속</button>
        <button class="btn" onclick="resetSim()">초기화 (08:00)</button>

        <span style="font-size: 12px; color: #a0aec0; margin-left: 10px;">행위자 추적:</span>
        <select class="select-agent" id="agentTracker" onchange="trackAgent(this.value)">
            <option value="">(자유 카메라)</option>
            <option value="agent_kim">김이장 (마을회관)</option>
            <option value="agent_park">박부녀 (회관광장)</option>
            <option value="agent_jung">정노인 (전통논)</option>
            <option value="agent_choi">최총무 (행정실무)</option>
            <option value="agent_lee">이지훈 (스마트온실)</option>
            <option value="agent_kang">강수연 (청년카페)</option>
            <option value="agent_cho">조민우 (귀농초보)</option>
            <option value="agent_han">한유진 (프리랜서)</option>
            <option value="agent_oh">오상회 (구판장)</option>
            <option value="agent_lin">린 (다문화농가)</option>
            <option value="agent_yoon">윤축산 (외곽축사)</option>
            <option value="agent_bae">배과수 (산비탈과수원)</option>
        </select>

        <div class="timeline-ctrl">
            <span>리플레이:</span>
            <input type="range" id="replaySlider" min="0" max="0" value="0" oninput="onSliderInput(this.value)">
            <span id="replayLabel" class="time-display">08:00</span>
        </div>
    </div>

    <div class="workspace">
        <div class="canvas-frame">
            <canvas id="villageCanvas" width="1080" height="780"></canvas>
        </div>

        <div class="analysis-panel">
            <div>
                <div class="section-title">
                    <span>사회적 자본 및 관계망 지표 (도킨스 호혜성 모델)</span>
                    <span id="totalContacts" style="color: #63b3ed; font-weight: normal;">총 접촉: 0회</span>
                </div>
                <div class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>행위자 쌍</th>
                                <th>접촉 빈도</th>
                                <th>신뢰 점수</th>
                                <th>태도 국면</th>
                            </tr>
                        </thead>
                        <tbody id="networkBody">
                            <tr><td colspan="4" style="text-align: center; color: #718096; padding: 20px;">집계 데이터 대기 중</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div style="flex: 1; display: flex; flex-direction: column;">
                <div class="section-title">
                    <span>자율 담론 및 동선 변경 로그</span>
                    <span style="font-weight: normal; color: #718096;">시간순 기록</span>
                </div>
                <div class="log-container" id="logStream">
                    <div class="log-entry">
                        <div class="log-meta">
                            <span>08:00</span>
                            <span class="log-actors">시스템</span>
                        </div>
                        <div class="log-text">자율 에이전트 시뮬레이션을 시작합니다. 주민을 클릭하면 머릿속 기억 스트림을 실시간 조회할 수 있습니다.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/map_data.js"></script>
    <script src="js/agents_data.js"></script>
    <script src="js/sim_engine.js"></script>

    <script>
        const sim = new VillageSimulator('villageCanvas');
        sim.start();

        const btnPlay = document.getElementById('btnPlayPause');
        const slider = document.getElementById('replaySlider');
        const replayLabel = document.getElementById('replayLabel');

        function togglePlay() {
            sim.isPaused = !sim.isPaused;
            sim.isReplayMode = false;
            btnPlay.innerText = sim.isPaused ? '재생' : '일시정지';
            btnPlay.className = sim.isPaused ? 'btn' : 'btn btn-active';
        }

        function setSpeed(sp) {
            sim.speed = sp;
            sim.isReplayMode = false;
            ['btnSpd1', 'btnSpd2', 'btnSpd5'].forEach(id => document.getElementById(id).className = 'btn');
            if (sp === 1.0) document.getElementById('btnSpd1').className = 'btn btn-active';
            if (sp === 2.0) document.getElementById('btnSpd2').className = 'btn btn-active';
            if (sp === 5.0) document.getElementById('btnSpd5').className = 'btn btn-active';
        }

        function resetSim() {
            location.reload();
        }

        function trackAgent(agentId) {
            sim.camera.trackingAgentId = agentId || null;
            if (agentId) {
                sim.camera.zoom = 1.2;
                const ag = sim.agents.find(a => a.id === agentId);
                if (ag) sim.inspectAgentState(ag);
            }
        }

        function onSliderInput(val) {
            sim.seekReplay(parseInt(val, 10));
            replayLabel.innerText = sim.getFormattedTime();
            btnPlay.innerText = '재생 (라이브 복귀)';
            btnPlay.className = 'btn';
        }

        window.updateTimelineSlider = function(currIdx, maxIdx) {
            if (!sim.isReplayMode) {
                slider.max = maxIdx - 1;
                slider.value = currIdx;
                replayLabel.innerText = sim.getFormattedTime();
            }
        };

        window.updateLogsUI = function(logs) {
            const container = document.getElementById('logStream');
            container.innerHTML = logs.slice(0, 30).map(l => `
                <div class="log-entry">
                    <div class="log-meta">
                        <span>${l.time}</span>
                        <span class="log-actors">${l.from} ↔ ${l.to}</span>
                    </div>
                    <div class="log-text">${l.msg}</div>
                </div>
            `).join('');
        };

        window.updateNetworkGraph = function(graph) {
            const tbody = document.getElementById('networkBody');
            const entries = Object.entries(graph)
                .filter(([k, v]) => v.count > 0)
                .sort((a, b) => b[1].count - a[1].count);

            const total = entries.reduce((acc, c) => acc + c[1].count, 0);
            document.getElementById('totalContacts').innerText = `총 접촉: ${total}회`;

            if (entries.length === 0) return;

            tbody.innerHTML = entries.slice(0, 15).map(([pair, data]) => {
                const [id1, id2] = pair.split('-');
                const ag1 = AGENTS_ROSTER.find(a => a.id === id1) || { name: id1 };
                const ag2 = AGENTS_ROSTER.find(a => a.id === id2) || { name: id2 };
                
                let trustColor = '#a0aec0';
                if (data.trust > 0) trustColor = '#48bb78';
                else if (data.trust < 0) trustColor = '#f56565';

                return `
                    <tr>
                        <td><strong>${ag1.name}</strong> ↔ <strong>${ag2.name}</strong></td>
                        <td style="font-variant-numeric: tabular-nums;">${data.count}회</td>
                        <td style="color: ${trustColor}; font-weight: bold; font-variant-numeric: tabular-nums;">
                            ${data.trust > 0 ? '+' + data.trust : data.trust}
                        </td>
                        <td style="color: ${trustColor};">${data.sentiment}</td>
                    </tr>
                `;
            }).join('');
        };
    </script>
</body>
</html>
