<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농촌 지역사회 행위자 시뮬레이터 (Saemaul-Smallville)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #12161f;
            color: #d1d5db;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 24px;
            line-height: 1.5;
        }

        /* Header: 간결하고 사실 중심의 학술 레이블 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 14px;
            border-bottom: 1px solid #2d3748;
            margin-bottom: 18px;
        }
        .title-block h1 {
            font-size: 18px;
            font-weight: 600;
            color: #f3f4f6;
            letter-spacing: -0.02em;
        }
        .title-block p {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 3px;
        }

        /* Control Bar: 정갈한 기능 버튼 */
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #1a202c;
            border: 1px solid #2d3748;
            padding: 10px 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #2d3748;
            color: #e5e7eb;
            border: 1px solid #4a5568;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #4a5568;
        }
        .btn-active {
            background-color: #2b6cb0;
            border-color: #3182ce;
            color: #ffffff;
        }

        .timeline-ctrl {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            font-size: 12px;
            color: #a0aec0;
        }
        .timeline-ctrl input[type="range"] {
            width: 200px;
            accent-color: #4299e1;
            cursor: pointer;
        }
        .time-display {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: #63b3ed;
            min-width: 44px;
        }

        /* Main Workspace: 1024px 지도 + 우측 분석 패널 */
        .workspace {
            display: grid;
            grid-template-columns: 1024px 1fr;
            gap: 20px;
            align-items: start;
        }

        .canvas-frame {
            border: 1px solid #2d3748;
            background-color: #0d1117;
            width: 1024px;
            height: 768px;
        }
        #villageCanvas {
            display: block;
        }

        /* Analysis Side: 표와 문단 중심 */
        .analysis-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 768px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            padding-bottom: 6px;
            border-bottom: 1px solid #2d3748;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .data-table-container {
            height: 310px;
            overflow-y: auto;
            border: 1px solid #2d3748;
            background-color: #1a202c;
        }
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        table.data-table th {
            background-color: #242c3d;
            color: #cbd5e0;
            padding: 7px 10px;
            border-bottom: 1px solid #2d3748;
            position: sticky;
            top: 0;
            font-weight: 600;
        }
        table.data-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #232a3b;
            color: #e2e8f0;
        }
        table.data-table tr:hover {
            background-color: #202738;
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #2d3748;
            background-color: #1a202c;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }
        .log-entry {
            border-bottom: 1px solid #242c3d;
            padding-bottom: 6px;
        }
        .log-meta {
            color: #718096;
            font-size: 11px;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }
        .log-actors {
            color: #63b3ed;
            font-weight: 500;
        }
        .log-text {
            color: #edf2f7;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-block">
            <h1>농촌 행위자 상호작용 시뮬레이터 (Saemaul-Smallville)</h1>
            <p>스탠포드 생성형 에이전트 인지 구조 기반 12인 지역사회 관계망 실증 모델</p>
        </div>
        <div>
            <button class="btn" onclick="sim.exportHistoryJSON()">시뮬레이션 기록 내보내기 (JSON)</button>
        </div>
    </header>

    <div class="controls">
        <button class="btn btn-active" id="btnPlayPause" onclick="togglePlay()">일시정지</button>
        <button class="btn" id="btnSpd1" onclick="setSpeed(1.0)">1배속</button>
        <button class="btn" id="btnSpd2" onclick="setSpeed(2.0)">2배속</button>
        <button class="btn" id="btnSpd5" onclick="setSpeed(5.0)">5배속</button>
        <button class="btn" onclick="resetSim()">초기화 (08:00)</button>

        <div class="timeline-ctrl">
            <span>리플레이 시점:</span>
            <input type="range" id="replaySlider" min="0" max="0" value="0" oninput="onSliderInput(this.value)">
            <span id="replayLabel" class="time-display">08:00</span>
        </div>
    </div>

    <div class="workspace">
        <div class="canvas-frame">
            <canvas id="villageCanvas" width="1024" height="768"></canvas>
        </div>

        <div class="analysis-panel">
            <div>
                <div class="section-title">
                    <span>행위자 간 접촉 및 사회적 관계망 집계</span>
                    <span id="totalContacts" style="color: #63b3ed; font-weight: normal;">총 접촉: 0회</span>
                </div>
                <div class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>에이전트 A</th>
                                <th>에이전트 B</th>
                                <th>접촉 빈도</th>
                                <th>유대 단계</th>
                            </tr>
                        </thead>
                        <tbody id="networkBody">
                            <tr><td colspan="4" style="text-align: center; color: #718096; padding: 20px;">집계 데이터 대기 중</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div style="flex: 1; display: flex; flex-direction: column;">
                <div class="section-title">
                    <span>상호작용 및 담론 로그</span>
                    <span style="font-weight: normal; color: #718096;">시간순 기록</span>
                </div>
                <div class="log-container" id="logStream">
                    <div class="log-entry">
                        <div class="log-meta">
                            <span>08:00</span>
                            <span class="log-actors">시스템</span>
                        </div>
                        <div class="log-text">시뮬레이션을 시작합니다. 12인의 행위자가 각자의 주거지에서 일과 거점으로 이동합니다.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/map_data.js"></script>
    <script src="js/agents_data.js"></script>
    <script src="js/sim_engine.js"></script>

    <script>
        const sim = new VillageSimulator('villageCanvas');
        sim.start();

        const btnPlay = document.getElementById('btnPlayPause');
        const slider = document.getElementById('replaySlider');
        const replayLabel = document.getElementById('replayLabel');

        function togglePlay() {
            sim.isPaused = !sim.isPaused;
            sim.isReplayMode = false;
            btnPlay.innerText = sim.isPaused ? '재생' : '일시정지';
            btnPlay.className = sim.isPaused ? 'btn' : 'btn btn-active';
        }

        function setSpeed(sp) {
            sim.speed = sp;
            sim.isReplayMode = false;
            ['btnSpd1', 'btnSpd2', 'btnSpd5'].forEach(id => document.getElementById(id).className = 'btn');
            if (sp === 1.0) document.getElementById('btnSpd1').className = 'btn btn-active';
            if (sp === 2.0) document.getElementById('btnSpd2').className = 'btn btn-active';
            if (sp === 5.0) document.getElementById('btnSpd5').className = 'btn btn-active';
        }

        function resetSim() {
            location.reload();
        }

        function onSliderInput(val) {
            sim.seekReplay(parseInt(val, 10));
            replayLabel.innerText = sim.getFormattedTime();
            btnPlay.innerText = '재생 (라이브 복귀)';
            btnPlay.className = 'btn';
        }

        window.updateTimelineSlider = function(currIdx, maxIdx) {
            if (!sim.isReplayMode) {
                slider.max = maxIdx - 1;
                slider.value = currIdx;
                replayLabel.innerText = sim.getFormattedTime();
            }
        };

        window.updateLogsUI = function(logs) {
            const container = document.getElementById('logStream');
            container.innerHTML = logs.slice(0, 30).map(l => `
                <div class="log-entry">
                    <div class="log-meta">
                        <span>${l.time}</span>
                        <span class="log-actors">${l.from} ↔ ${l.to}</span>
                    </div>
                    <div class="log-text">${l.msg}</div>
                </div>
            `).join('');
        };

        window.updateNetworkGraph = function(matrix) {
            const tbody = document.getElementById('networkBody');
            const sorted = Object.entries(matrix)
                .filter(([k, v]) => v > 0)
                .sort((a, b) => b[1] - a[1]);

            const sum = sorted.reduce((acc, c) => acc + c[1], 0);
            document.getElementById('totalContacts').innerText = `총 접촉: ${sum}회`;

            if (sorted.length === 0) return;

            tbody.innerHTML = sorted.slice(0, 15).map(([pair, count]) => {
                const [id1, id2] = pair.split('-');
                const ag1 = AGENTS_ROSTER.find(a => a.id === id1) || { name: id1 };
                const ag2 = AGENTS_ROSTER.find(a => a.id === id2) || { name: id2 };
                const tieLevel = count >= 4 ? '밀접 유대' : (count >= 2 ? '단순 접촉' : '초기 접촉');
                return `
                    <tr>
                        <td>${ag1.name}</td>
                        <td>${ag2.name}</td>
                        <td style="font-variant-numeric: tabular-nums;">${count}회</td>
                        <td style="color: ${count >= 4 ? '#68d391' : '#a0aec0'};">${tieLevel}</td>
                    </tr>
                `;
            }).join('');
        };
    </script>
</body>
</html>
