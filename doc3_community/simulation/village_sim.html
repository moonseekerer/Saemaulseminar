<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saemaul-Smallville: 12인 농촌 시뮬레이터</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #334155; margin-bottom: 16px; }
        .header h1 { font-size: 20px; font-weight: 700; color: #38bdf8; }
        .header .subtitle { font-size: 13px; color: #94a3b8; margin-top: 4px; }

        .control-panel { display: flex; gap: 12px; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; border: 1px solid #334155; flex-wrap: wrap; }
        .btn { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 6px 14px; border-radius: 4px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #475569; }
        .btn-primary { background: #0284c7; border-color: #38bdf8; }

        .replay-box { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .slider { width: 180px; accent-color: #38bdf8; cursor: pointer; }

        .main-layout { display: grid; grid-template-columns: 1024px 1fr; gap: 16px; }

        .canvas-container { position: relative; border: 1px solid #334155; border-radius: 6px; overflow: hidden; background: #000; }
        #villageCanvas { display: block; }

        .side-layout { display: flex; flex-direction: column; gap: 16px; height: 768px; }

        .card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; }
        .card-header { font-size: 14px; font-weight: 700; color: #e2e8f0; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; }

        .network-wrap { height: 270px; overflow-y: auto; }
        .network-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .network-table th, .network-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #334155; }
        .network-table th { color: #94a3b8; font-weight: 600; }

        .log-stream { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
        .log-item { background: #0f172a; padding: 8px 10px; border-radius: 4px; border-left: 3px solid #38bdf8; }
        .log-meta { display: flex; justify-content: space-between; color: #64748b; font-size: 11px; margin-bottom: 4px; }
        .log-msg { color: #f1f5f9; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>Saemaul-Smallville: 12인 농촌 시뮬레이터</h1>
            <div class="subtitle">지역사회구조연구(0682-01) 자유 주제 시뮬레이션 연구 도구 (스탠포드 Generative Agents 아키텍처 계승)</div>
        </div>
        <div>
            <button class="btn" onclick="sim.exportHistoryJSON()">기록 내보내기 (JSON)</button>
        </div>
    </div>

    <div class="control-panel">
        <button class="btn btn-primary" id="btnPlayPause" onclick="togglePlay()">일시정지</button>
        <button class="btn" onclick="setSpeed(1.0)">1x 배속</button>
        <button class="btn" onclick="setSpeed(2.0)">2x 배속</button>
        <button class="btn" onclick="setSpeed(5.0)">5x 배속</button>
        <button class="btn" onclick="resetSim()">처음부터 (08:00)</button>

        <div class="replay-box">
            <span style="font-size: 12px; color: #94a3b8;">리플레이 탐색:</span>
            <input type="range" id="replaySlider" class="slider" min="0" max="0" value="0" oninput="onSliderInput(this.value)">
            <span id="replayLabel" style="font-size: 12px; color: #38bdf8; font-weight: bold;">08:00</span>
        </div>
    </div>

    <div class="main-layout">
        <!-- 2D Canvas -->
        <div class="canvas-container">
            <canvas id="villageCanvas" width="1024" height="768"></canvas>
        </div>

        <!-- Dashboard Side -->
        <div class="side-layout">
            <!-- Network Matrix -->
            <div class="card" style="height: 310px;">
                <div class="card-header">
                    <span>사회적 자본 및 접촉 연결망</span>
                    <span id="contactCount" style="color: #38bdf8;">누적 상호작용: 0회</span>
                </div>
                <div class="network-wrap">
                    <table class="network-table">
                        <thead>
                            <tr>
                                <th>에이전트 1</th>
                                <th>에이전트 2</th>
                                <th>접촉 빈도</th>
                                <th>신뢰 유대</th>
                            </tr>
                        </thead>
                        <tbody id="networkBody">
                            <tr><td colspan="4" style="text-align: center; color: #64748b;">상호작용 데이터 집계 중...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Dialogue Log Stream -->
            <div class="card" style="flex: 1;">
                <div class="card-header">
                    <span>실시간 소통 및 소문 전파 기록</span>
                    <span style="font-size: 11px; color: #94a3b8;">최신순 정렬</span>
                </div>
                <div class="log-stream" id="logStream">
                    <div class="log-item">
                        <div class="log-meta"><span>08:00</span><span>시스템</span></div>
                        <div class="log-msg">12인 농촌 시뮬레이션이 시작되었습니다. 주민들이 각자의 거점으로 이동합니다.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/map_data.js"></script>
    <script src="js/agents_data.js"></script>
    <script src="js/sim_engine.js"></script>

    <script>
        const sim = new VillageSimulator('villageCanvas');
        sim.start();

        const btnPlay = document.getElementById('btnPlayPause');
        const slider = document.getElementById('replaySlider');
        const replayLabel = document.getElementById('replayLabel');

        function togglePlay() {
            sim.isPaused = !sim.isPaused;
            sim.isReplayMode = false;
            btnPlay.innerText = sim.isPaused ? '재생' : '일시정지';
        }

        function setSpeed(sp) {
            sim.speed = sp;
            sim.isReplayMode = false;
        }

        function resetSim() {
            location.reload();
        }

        function onSliderInput(val) {
            sim.seekReplay(parseInt(val, 10));
            replayLabel.innerText = sim.getFormattedTime();
            btnPlay.innerText = '재생 (라이브 복귀)';
        }

        window.updateTimelineSlider = function(currIdx, maxIdx) {
            if (!sim.isReplayMode) {
                slider.max = maxIdx - 1;
                slider.value = currIdx;
                replayLabel.innerText = sim.getFormattedTime();
            }
        };

        window.updateLogsUI = function(logs) {
            const container = document.getElementById('logStream');
            container.innerHTML = logs.slice(0, 30).map(l => `
                <div class="log-item">
                    <div class="log-meta">
                        <span>${l.time}</span>
                        <span style="color: #38bdf8;">${l.from} → ${l.to}</span>
                    </div>
                    <div class="log-msg">${l.msg}</div>
                </div>
            `).join('');
        };

        window.updateNetworkGraph = function(matrix) {
            const tbody = document.getElementById('networkBody');
            const sorted = Object.entries(matrix)
                .filter(([k, v]) => v > 0)
                .sort((a, b) => b[1] - a[1]);

            document.getElementById('contactCount').innerText = `누적 상호작용: ${sorted.reduce((acc, c) => acc + c[1], 0)}회`;

            if (sorted.length === 0) return;

            tbody.innerHTML = sorted.slice(0, 15).map(([pair, count]) => {
                const [id1, id2] = pair.split('-');
                const ag1 = AGENTS_ROSTER.find(a => a.id === id1) || { name: id1 };
                const ag2 = AGENTS_ROSTER.find(a => a.id === id2) || { name: id2 };
                return `
                    <tr>
                        <td><strong>${ag1.name}</strong></td>
                        <td><strong>${ag2.name}</strong></td>
                        <td><span style="color: #38bdf8; font-weight: bold;">${count}회</span></td>
                        <td>${count >= 3 ? '<span style="color: #4ade80;">강한 유대</span>' : '<span style="color: #94a3b8;">초기 접촉</span>'}</td>
                    </tr>
                `;
            }).join('');
        };
    </script>
</body>
</html>
